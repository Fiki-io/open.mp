name: Build open.mp for Android ARM64

on:
  workflow_dispatch: # Supaya bisa kamu klik tombol "Run workflow" kapan saja secara manual

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repository beserta submodules (PENTING!)
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # 2. Install Tools Kompilasi
    - name: Install Build Tools & Python
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build python3-pip
        pip3 install conan

    # 3. Setup Android NDK
    - name: Setup Android NDK
      uses: nkeywal/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r25c

    # 4. Generate & Compile Project via CMake untuk Android ARM64
    - name: Configure and Build
      run: |
        mkdir build_android
        cd build_android
        cmake -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-24 \
          -DCMAKE_BUILD_TYPE=Release \
          ..
        ninja

    # 5. Upload File Hasil Kompilasi ke GitHub
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: openmp-server-android-arm64
        path: build_android/omp-server
