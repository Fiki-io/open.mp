name: Build open.mp for Android ARM64

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repository beserta submodules-nya
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # 2. Install Tools & Conan 2
    - name: Install Build Tools & Conan 2
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build python3-pip
        pip3 install "conan>=2.0" --break-system-packages || pip3 install "conan>=2.0"
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        export PATH="$HOME/.local/bin:$PATH"
        conan profile detect --force

    # 3. Setup Android NDK
    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r25c

    # 4. Set Konfigurasi Global Conan untuk NDK Android
    - name: Set Conan Global Config
      run: |
        mkdir -p ~/.conan2
        echo "tools.android:ndk_path=${{ steps.setup-ndk.outputs.ndk-path }}" >> ~/.conan2/global.conf

    # 5. Generate Build Files dengan CMake
    - name: Configure CMake
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        mkdir build_android
        cd build_android
        cmake -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a \
          -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
          -DANDROID_PLATFORM=android-24 \
          -DCMAKE_BUILD_TYPE=Release \
          ..

    # 6. Kompilasi Server
    - name: Build Server
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        cd build_android
        ninja

    # 7. Upload Hasil Build
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: openmp-server-android-arm64
        path: build_android/omp-server
