name: Build open.mp for Android ARM64

on:
  workflow_dispatch: # Agar bisa diklik manual "Run workflow"

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repository beserta submodules-nya
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # 2. Install Tools Kompilasi
    - name: Install Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build python3-pip

    # 3. Setup Android NDK (Sudah diperbaiki)
    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r25c

    # 4. Generate Build Files dengan CMake
    - name: Configure CMake
      run: |
        mkdir build_android
        cd build_android
        cmake -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-24 \
          -DCMAKE_BUILD_TYPE=Release \
          ..

    # 5. Kompilasi Server
    - name: Build Server
      run: |
        cd build_android
        ninja

    # 6. Upload Hasil Build
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: openmp-server-android-arm64
        path: build_android/omp-server
